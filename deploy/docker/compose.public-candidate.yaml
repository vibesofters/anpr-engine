# Web-only HTTPS route is active. Public inference uses the proxy-verified
# client-IP header and a persistent daily quota; see the release runbook.
name: anpr-public-candidate
services:
  inference:
    image: sha256:27d7192fba1ae159ce3443b1789729389940c642c5681eecafab489cbd4602e3
    pull_policy: never
    environment:
      ANPR_SERVICE_ENV: production
      ANPR_INTERNAL_SERVICE_CREDENTIAL: ${ANPR_INTERNAL_SERVICE_CREDENTIAL}
      ANPR_APPLICATION_VERSION: ${ANPR_APPLICATION_VERSION}
      ANPR_INFERENCE_DEVICE: cpu
      ANPR_INFERENCE_DEADLINE_SECONDS: "120"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - type: bind
        source: ${ANPR_PRIVATE_MODEL_BUNDLE_SOURCE}
        target: /models
        read_only: true
    networks: [private]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001
    cpus: 0.75
    mem_limit: 2048m
    pids_limit: 96
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 8
      start_period: 120s

  web:
    image: sha256:9a41b35a20bc17456d25e157c541483151b35e868414746d88061e907419f273
    pull_policy: never
    environment:
      ANPR_PUBLIC_ORIGIN: https://anpr-engine.vibesofters.com
      ANPR_PRIVATE_INFERENCE_URL: http://inference:8080
      ANPR_INTERNAL_SERVICE_CREDENTIAL: ${ANPR_INTERNAL_SERVICE_CREDENTIAL}
      ANPR_LOCAL_DIRECT_MODE: "0"
      ANPR_DAILY_QUOTA_PATH: /quota/quota.sqlite
      ANPR_PROXY_PROOF_ENABLED: "0"
      ANPR_TRUSTED_PROXY_IP_HEADER: x-real-ip
      ANPR_RATE_LIMIT_EXEMPT_IPS: ${ANPR_RATE_LIMIT_EXEMPT_IPS:-}
    expose:
      - "3000"
    depends_on:
      inference:
        condition: service_healthy
    networks: [front, private]
    volumes:
      - quota_data:/quota
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001
      # Next.js image optimization writes a bounded cache at runtime.
      - /app/apps/web/.next/cache:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001
    cpus: 0.25
    mem_limit: 512m
    pids_limit: 64
    restart: "no"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  front: {}
  private:
    internal: true

volumes:
  quota_data: {}
