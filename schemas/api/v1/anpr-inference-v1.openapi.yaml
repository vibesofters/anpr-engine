openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: ANPR Engine public image-inference boundary
  version: 1.0.0
  description: >-
    Planned browser-to-BFF contract for one bounded JPEG or PNG. This document
    is a contract artifact; no server is implemented by Phase 2A.
paths:
  /api/inference:
    post:
      operationId: inferSingleImage
      summary: Process one authorized image without intentional server-side retention
      parameters:
        - name: X-Privacy-Acknowledged
          in: header
          required: true
          description: Responsible-use acknowledgement; it is not represented as the sole legal basis.
          schema:
            type: string
            const: "true"
      requestBody:
        required: true
        description: >-
          Exactly one encoded image, no filename or multipart wrapper. The BFF
          applies a 10 MiB streaming limit before decoding.
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
              maxLength: 10485760
          image/png:
            schema:
              type: string
              format: binary
              maxLength: 10485760
      responses:
        "200":
          description: Current-request result; human review is mandatory.
          content:
            application/json:
              schema:
                $ref: ./anpr-image-inference-response-v1.schema.json
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
      security:
        - sessionCookie: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: anpr_session
      description: Secure server-issued admission cookie; it is never accepted in request JSON.
  responses:
    Error:
      description: Safe error envelope containing no image, plate, path, session, or exception content.
      content:
        application/json:
          schema:
            $ref: ./anpr-api-error-v1.schema.json
